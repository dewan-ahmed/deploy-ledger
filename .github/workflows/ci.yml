name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  infra:
    name: Infra (typecheck + tests + synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            infra/package-lock.json
      # The CDK app bundles the handlers from app/, so both packages need their dependencies.
      - run: npm ci
        working-directory: app
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx cdk synth --quiet
